# ============================================================
# 로컬에서 컨테이너를 손쉽게 띄우기 위한 설정 (개발자 확인용)
#
#   docker compose up -d --build     # 빌드 후 실행 (http://localhost:8080)
#   docker compose logs -f           # 로그 보기
#   docker compose down              # 중지
#
# 문의 폼 키는 같은 폴더의 .env.local 에서 읽어옵니다.
#
# ⚠ 서버 배포에는 이 파일을 쓰지 않습니다.
#   서버는 deploy/docker-compose.{dev,prod}.yml 을 사용합니다 → deploy/README.md
#
# 캐릭터는 접속 도메인으로 정해지므로 localhost 에서는 기본값(bella)이 뜹니다.
# 다른 캐릭터를 보려면 ?character=shiro 쿼리를 붙이세요.
# ============================================================

services:
  site:
    build:
      context: .
      args:
        # 도메인이 여러 개지만 빌드는 하나이므로 SNS 공유 이미지용 대표 도메인 1개를 지정합니다.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://evertreasure-bella.bigglz.com}
        NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY:-}
    image: evertreasure-site:${IMAGE_TAG:-local}
    container_name: evertreasure-site-local
    restart: unless-stopped
    ports:
      - '8080:80'
