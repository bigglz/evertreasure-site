# ============================================================
# 컨테이너 내부 Nginx — 정적 파일 서빙 전용
# (도메인 연결·TLS·리다이렉트는 앞단 Nginx가 담당합니다.
#  앞단 설정 예시는 docker/nginx.host.conf.example 참고)
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 이미 압축된 포맷(webp/mp4)은 제외하고 텍스트 자원만 압축합니다.
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── Next.js 번들: 파일명에 해시가 포함되어 있어 영구 캐시 가능 ──
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── 이미지·영상·폰트: 파일명이 고정이라 교체 가능성을 고려해 1주일 ──
    location /assets/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # ── HTML: 매 요청마다 검증 ──
    # 캐시하면 문구·캐릭터 매핑을 수정해 재배포해도 방문자에게 며칠간 반영되지 않습니다.
    location / {
        add_header Cache-Control "no-cache" always;
        # next.config.mjs 의 trailingSlash: true 때문에 URL이 / 로 끝납니다.
        # 마지막 인자를 파일(/404.html)로 두면 상태 코드가 200이 되어버리므로
        # =404 로 끝내고 아래 error_page 로 404 페이지를 보여줍니다.
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Next.js 가 생성한 404 페이지를 올바른 404 상태 코드와 함께 응답합니다.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
