# ============================================================
# 상용(prod) 환경 — 사이트 컨테이너만 (앞단 Nginx는 기존 main-gateway 사용)
#
# 담당 도메인: evertreasure-{bella,lumi,nua,shiro,tenzo}.bigglz.com
#
# dev 와 완전히 같은 구조이며 컨테이너 이름·이미지 태그만 다릅니다.
# 같은 서버에서 dev 스택과 나란히 떠 있어도 서로 간섭하지 않습니다.
#
#   IMAGE_TAG=0.0002 docker compose -f deploy/docker-compose.prod.yml up -d
#   docker compose -f deploy/docker-compose.prod.yml ps
#   docker compose -f deploy/docker-compose.prod.yml logs -f
#
# ⚠ IMAGE_TAG 는 기본값이 없습니다(의도된 설계).
#   태그를 빼먹으면 조용히 엉뚱한 버전이 올라가는 대신 에러가 납니다.
#   dev 에서 검증을 끝낸 "그 태그"를 그대로 올리는 것이 배포입니다.
#
#   sudo 로 실행한다면 sudo 가 환경변수를 지우므로 -E 를 붙이거나
#   --env-file 을 쓰세요. deploy-remote.sh 는 --env-file 로 처리합니다.
# ============================================================

# dev 스택과 프로젝트 이름을 분리합니다.
name: evertreasure-prod

services:
  site:
    image: "evertreasure-site:${IMAGE_TAG:?IMAGE_TAG 를 지정하세요 - 예 IMAGE_TAG=0.0002}"
    container_name: evertreasure-site-prod
    restart: unless-stopped

    expose:
      - '80'

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

    networks:
      - give-network

networks:
  give-network:
    external: true
