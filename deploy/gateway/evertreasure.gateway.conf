# ============================================================
# main-gateway(공용 앞단 Nginx) 에 들어가는 EverTreasure 설정 — 레퍼런스
#
# ⚠ 이 파일은 그대로 마운트되지 않습니다. 실제 설정은 gateway 프로젝트의
#   단일 파일 conf/nginx.conf 안에 있고(서버: /home/bigglz/containers/gateway),
#   그 파일에는 다른 서비스(nfc-giveandtag)의 블록도 함께 들어 있습니다.
#   여기 내용을 그 파일의 http { } 블록 안에 복사해 넣으세요.
#
#   저장소에 사본을 두는 이유: 서버에만 있으면 변경 이력이 남지 않습니다.
#   서버 설정을 고쳤다면 이 파일도 같이 갱신하세요.
#
# 적용 방법:
#   sudo tee ./conf/nginx.conf > /dev/null <<'CONF'   ← mv 금지(아래 참고)
#   ...
#   CONF
#   sudo docker exec main-gateway nginx -t
#   sudo docker exec main-gateway nginx -s reload
#
# ⚠ conf/nginx.conf 는 단일 파일 바인드 마운트라 inode 에 고정됩니다.
#   vi·nano·mv 처럼 파일을 "교체"하면 컨테이너는 옛 파일을 계속 읽습니다.
#   반드시 tee 같은 제자리 덮어쓰기를 쓰고, 이미 어긋났다면 컨테이너를
#   재생성해야 합니다:  sudo docker compose up -d --force-recreate gateway
# ============================================================


# ── http { } 블록 맨 위 ─────────────────────────────────────

# 검색엔진 중복 콘텐츠 방지: 10개 도메인이 완전히 동일한 HTML을 서빙하므로
# 대표 도메인 1개만 색인시키고 나머지는 전부 제외합니다.
# 정적 HTML이라 도메인별 canonical 태그를 심을 수 없어 헤더로 처리합니다.
# default 가 noindex 이므로 개발 도메인은 자동으로 색인에서 빠집니다.
map $host $et_robots {
    default                        "noindex, nofollow";
    evertreasure-bella.bigglz.com  "index, follow";
}

# 개발 환경 — 컨테이너 1개가 캐릭터 도메인 5개를 모두 서비스합니다.
# (캐릭터는 브라우저가 hostname 으로 판별합니다. src/lib/character.ts 참고)
upstream evertreasure-dev-group {
    server evertreasure-site-dev:80;
}

# 상용 환경
upstream evertreasure-prod-group {
    server evertreasure-site-prod:80;
}


# ── 80번 포트 ───────────────────────────────────────────────
# gateway 의 80 블록은 다른 서비스와 공유합니다. 아래 도메인들을
# 그 블록의 server_name 에 추가하세요.
#
#   evertreasure-dev-bella.bigglz.com
#   evertreasure-dev-lumi.bigglz.com
#   evertreasure-dev-nua.bigglz.com
#   evertreasure-dev-shiro.bigglz.com
#   evertreasure-dev-tenzo.bigglz.com
#   evertreasure-bella.bigglz.com
#   evertreasure-lumi.bigglz.com
#   evertreasure-nua.bigglz.com
#   evertreasure-shiro.bigglz.com
#   evertreasure-tenzo.bigglz.com
#
# ⚠ 여기에 없는 도메인은 인증서 발급·갱신이 실패합니다.
#   80 블록에는 ACME 챌린지 location 이 리다이렉트보다 먼저 와야 합니다.


# ── 443 포트: 개발 ──────────────────────────────────────────
server {
    listen 443 ssl;
    server_name evertreasure-dev-bella.bigglz.com
                evertreasure-dev-lumi.bigglz.com
                evertreasure-dev-nua.bigglz.com
                evertreasure-dev-shiro.bigglz.com
                evertreasure-dev-tenzo.bigglz.com;

    # 인증서 폴더 이름 = 발급 시 첫 번째 -d 도메인 (shiro 를 먼저 발급했음)
    ssl_certificate     /etc/letsencrypt/live/evertreasure-dev-shiro.bigglz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evertreasure-dev-shiro.bigglz.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 개발 환경은 대표 도메인 여부와 무관하게 항상 색인 제외입니다.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # HSTS 는 개발 환경에 걸지 마세요.
    # 브라우저가 이 도메인의 HTTP 접속을 장기간 거부해 실험이 번거로워집니다.

    client_max_body_size 1m;

    location / {
        proxy_pass http://evertreasure-dev-group;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 캐릭터 모션 영상이 개당 약 9MB입니다.
        # 임시 파일에 모으지 않고 바로 흘려보내야 첫 재생이 늦지 않습니다.
        proxy_max_temp_file_size 0;
    }
}


# ── 443 포트: 상용 ──────────────────────────────────────────
server {
    listen 443 ssl;
    server_name evertreasure-bella.bigglz.com
                evertreasure-lumi.bigglz.com
                evertreasure-nua.bigglz.com
                evertreasure-shiro.bigglz.com
                evertreasure-tenzo.bigglz.com;

    ssl_certificate     /etc/letsencrypt/live/evertreasure-bella.bigglz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evertreasure-bella.bigglz.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ⚠ 이 줄이 없으면 동일한 HTML 을 서빙하는 5개 도메인이 전부 색인되어
    #   중복 콘텐츠가 됩니다. 위 map 과 반드시 세트로 넣으세요.
    add_header X-Robots-Tag           $et_robots always;
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # HSTS: 브라우저가 1년간 이 도메인을 HTTPS로만 접속합니다.
    # 되돌리려면 헤더를 지운 뒤 캐시 만료까지 기다려야 하므로
    # 도메인이 안정된 뒤에 켜세요. (includeSubDomains 는 일부러 뺐습니다)
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://evertreasure-prod-group;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_max_temp_file_size 0;
    }
}
