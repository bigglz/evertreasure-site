# ============================================================
# 개발(dev) 환경 — 사이트 컨테이너만 (앞단 Nginx는 기존 main-gateway 사용)
#
# 담당 도메인: evertreasure-dev-{bella,lumi,nua,shiro,tenzo}.bigglz.com
#
# 이 서버에는 이미 main-gateway(nginx) + certbot 스택이 80/443 을 점유한 채
# 떠 있습니다. 따라서 여기서는 포트를 열지 않고, 같은 도커 네트워크에 붙어
# main-gateway 가 http://evertreasure-site-dev:80 으로 프록시하게 합니다.
#
# ⚠ standalone/docker-compose.server.yml 과 동시에 띄우지 마세요.
#   그쪽은 자체 nginx/certbot 이 80·443 을 잡으므로 main-gateway 와 충돌합니다.
#
#   docker compose -f deploy/docker-compose.dev.yml up -d
#   docker compose -f deploy/docker-compose.dev.yml ps
#   docker compose -f deploy/docker-compose.dev.yml logs -f
#
# 이미지 태그는 --env-file deploy/.env.dev 또는 환경변수 IMAGE_TAG 로 지정합니다.
# (deploy-remote.sh 가 자동으로 처리합니다)
#
# ⚠ 캐릭터(bella·lumi·nua·shiro·tenzo)는 브라우저가 접속 도메인으로 판별하므로
#   컨테이너는 환경당 하나만 띄우면 5개 도메인 모두 정상 동작합니다.
#   (src/lib/character.ts 참고)
# ============================================================

# prod 스택과 프로젝트 이름을 분리합니다.
# 이게 없으면 폴더 이름이 프로젝트명이 되어 dev/prod 가 서로를 지웁니다.
name: evertreasure-dev

services:
  site:
    image: "${IMAGE_NAME:-evertreasure-site}:${IMAGE_TAG:?IMAGE_TAG 를 지정하세요 - 예 IMAGE_TAG=0.0002}"
    container_name: evertreasure-site-dev
    restart: unless-stopped

    # 호스트 포트를 열지 않습니다. 앞단 main-gateway 만 접근하면 됩니다.
    expose:
      - '80'

    # 로그가 디스크를 채우지 않도록 제한합니다.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

    networks:
      - give-network

networks:
  # main-gateway 가 사용 중인 기존 네트워크에 참여합니다.
  give-network:
    external: true
