# ============================================================
# 앞단 Nginx (도커) — 80번 포트
#   · certbot HTTP-01 챌린지 경로 응답
#   · 나머지 요청은 HTTPS로 리다이렉트
#
# 이 파일은 인증서가 없어도 정상 동작합니다.
# 인증서를 발급한 뒤 evertreasure-ssl.conf.disabled 를
# evertreasure-ssl.conf 로 이름만 바꾸면 HTTPS가 켜집니다.
# ============================================================

# 검색엔진 중복 콘텐츠 방지: 5개 도메인이 완전히 동일한 HTML을 서빙하므로
# 대표 도메인 1개만 색인시키고 나머지는 제외합니다.
# 정적 HTML이라 도메인별 canonical 태그를 심을 수 없어 헤더로 처리합니다.
map $host $et_robots {
    default                        "noindex, nofollow";
    evertreasure-bella.bigglz.com  "index, follow";
}

server {
    listen 80;
    listen [::]:80;
    server_name evertreasure-bella.bigglz.com
                evertreasure-lumi.bigglz.com
                evertreasure-nua.bigglz.com
                evertreasure-shiro.bigglz.com
                evertreasure-tenzo.bigglz.com;

    # ⚠ 이 블록이 리다이렉트보다 먼저 와야 인증서 발급·갱신이 됩니다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
