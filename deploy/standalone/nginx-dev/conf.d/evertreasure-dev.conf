# ============================================================
# 테스트 서버용 앞단 Nginx — 80번 포트
#   · certbot HTTP-01 챌린지 경로 응답
#   · 나머지 요청은 HTTPS로 리다이렉트
#
# ⚠ 이 파일들은 운영용(nginx/conf.d/)과 함께 두지 마세요.
#   테스트 서버의 nginx/conf.d/ 안에는 dev 파일만 있어야 합니다.
#   (서버 블록이 겹쳐 어느 쪽이 응답할지 예측하기 어려워집니다)
#
# 인증서를 발급한 뒤 evertreasure-dev-ssl.conf.disabled 를
# evertreasure-dev-ssl.conf 로 이름만 바꾸면 HTTPS가 켜집니다.
# ============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name evertreasure-dev-shiro.bigglz.com
                evertreasure-dev-tenzo.bigglz.com;

    # ⚠ 이 블록이 리다이렉트보다 먼저 와야 인증서 발급·갱신이 됩니다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
